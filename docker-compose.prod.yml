x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  postgres:
    logging: *default-logging
    image: postgres:16
    container_name: payflow_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7-alpine
    container_name: payflow_prod_redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    logging: *default-logging
    image: rabbitmq:4-management
    container_name: payflow_prod_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - prod_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    logging: *default-logging
    image: payflow-auth-service:session-security-7c18-r1
    container_name: payflow_prod_auth
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4002/api/auth/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: ${REDIS_URL}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS}
      SMSGATEWAYHUB_API_KEY: ${SMSGATEWAYHUB_API_KEY}
      SMSGATEWAYHUB_ENTITY_ID: ${SMSGATEWAYHUB_ENTITY_ID}
      SMSGATEWAYHUB_SENDER_ID: ${SMSGATEWAYHUB_SENDER_ID}
      SMSGATEWAYHUB_TEMPLATE_ID: ${SMSGATEWAYHUB_TEMPLATE_ID}

  wallet-service:
    logging: *default-logging
    image: payflow-wallet-service:fraud-7c17-r1
    container_name: payflow_prod_wallet
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL}
      WALLET_TRANSFER_BURST_MAX: ${WALLET_TRANSFER_BURST_MAX:-5}
      WALLET_TRANSFER_BURST_WINDOW_SECONDS: ${WALLET_TRANSFER_BURST_WINDOW_SECONDS:-300}
      WALLET_TRANSFER_HOURLY_MAX: ${WALLET_TRANSFER_HOURLY_MAX:-20}
      WALLET_TRANSFER_DAILY_MAX: ${WALLET_TRANSFER_DAILY_MAX:-100}
      WALLET_TRANSFER_DAILY_AMOUNT_MAX: ${WALLET_TRANSFER_DAILY_AMOUNT_MAX:-100000}
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${RABBITMQ_URL}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      QR_SIGNING_SECRET_CURRENT: ${QR_SIGNING_SECRET_CURRENT}
      QR_SIGNING_SECRET_PREVIOUS: ${QR_SIGNING_SECRET_PREVIOUS}
      PAYMENT_SETTLEMENT_INTERNAL_TOKEN: ${PAYMENT_SETTLEMENT_INTERNAL_TOKEN}
    networks:
      default:
        aliases:
          - wallet-service

  payment-service:
    logging: *default-logging
    image: payflow-payment-service:upi-security-7c23-r1
    container_name: payflow_prod_payment
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4005/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      PAYMENT_ORDER_RATE_LIMIT_MAX: ${PAYMENT_ORDER_RATE_LIMIT_MAX:-10}
      PAYMENT_ORDER_RATE_LIMIT_WINDOW_SECONDS: ${PAYMENT_ORDER_RATE_LIMIT_WINDOW_SECONDS:-60}
      NODE_ENV: production
      PAYMENT_SERVICE_PORT: 4005
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PAYMENT_RABBITMQ_QUEUE: ${PAYMENT_RABBITMQ_QUEUE:-payment_events}
      WALLET_SERVICE_URL: http://wallet-service:4001/api/v1
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}

      PAYMENT_SETTLEMENT_INTERNAL_TOKEN: ${PAYMENT_SETTLEMENT_INTERNAL_TOKEN}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  notification-service:
    logging: *default-logging
    image: payflow-notification-service:security-7c16-authz-r1
    container_name: payflow_prod_notification
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4006/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NOTIFICATION_SERVICE_PORT: 4006
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      AUTH_SERVICE_URL: http://auth-service:4002/api
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set production HTTPS allowed origin(s)}"

  reward-service:
    logging: *default-logging
    image: payflow-reward-service:deploy
    container_name: payflow_prod_reward
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REWARD_SERVICE_PORT: 4007
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      PAYMENT_RABBITMQ_QUEUE: ${PAYMENT_RABBITMQ_QUEUE:-payment_events}
    expose:
      - '4007'
  api-gateway:
    logging: *default-logging
    image: payflow-api-gateway:mobile-otp-r1
    container_name: payflow_prod_gateway
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - auth-service
      - wallet-service
      - payment-service
      - notification-service
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:4002/api
      WALLET_SERVICE_URL: http://wallet-service:4001/api/v1
      PAYMENT_SERVICE_URL: http://payment-service:4005/api/v1
      NOTIFICATION_SERVICE_URL: http://notification-service:4006
      REWARD_SERVICE_URL: http://reward-service:4007/api/v1
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?Set production HTTPS allowed origin(s)}"
    ports:
      - '4000:4000'

    networks:
      default:
        aliases:
          - api-gateway
  web:
    logging: *default-logging
    image: payflow-web:mobile-otp-auto-vpa-r4
    container_name: payflow_prod_web
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      COOKIE_SECURE: 'true'
      NEXT_PUBLIC_API_GATEWAY_URL: "${NEXT_PUBLIC_API_GATEWAY_URL:?Set real production HTTPS API Gateway URL}"
      API_GATEWAY_INTERNAL_URL: http://api-gateway:4000/api/v1
      WALLET_SERVICE_INTERNAL_URL: http://wallet-service:4001/api/v1
    ports:
      - '3000:3000'

    networks:
      default:
        aliases:
          - web
  admin-web:
    logging: *default-logging
    image: payflow-admin-web:test
    container_name: payflow_prod_admin
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      COOKIE_SECURE: 'true'
      NEXT_PUBLIC_API_GATEWAY_URL: "${NEXT_PUBLIC_API_GATEWAY_URL:?Set real production HTTPS API Gateway URL}"
      API_GATEWAY_INTERNAL_URL: http://api-gateway:4000/api/v1
    ports:
      - '3001:3001'

volumes:
  prod_postgres_data:
  prod_rabbitmq_data:
