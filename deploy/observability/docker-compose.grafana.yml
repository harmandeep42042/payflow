services:
  grafana:
    image: grafana/grafana@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: payflow_grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3002:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/payflow-dashboards:ro
      - type: bind
        source: "D:/my work/payflow-clean-secrets/grafana/grafana_admin_password.txt"
        target: /run/secrets/grafana_admin_password
        read_only: true

    networks:
      - payflow_default

volumes:
  grafana_data:
    name: payflow_grafana_data

networks:
  payflow_default:
    external: true
    name: payflow_default