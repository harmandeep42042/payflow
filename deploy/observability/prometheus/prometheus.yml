global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: payflow-gateway
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - api-gateway:4000

  - job_name: payflow-auth
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - auth-service:4002

  - job_name: payflow-wallet
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - wallet-service:4001

  - job_name: payflow-payment
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - payment-service:4005

  - job_name: payflow-notification
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - notification-service:4006