name: Payflow CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Payflow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=critical

      - name: Backend builds
        run: pnpm exec nx run-many -t build -p api-gateway,auth-service,wallet-service,payment-service,notification-service,reward-service --parallel=3

      - name: Backend tests
        run: pnpm exec nx run-many -t test -p api-gateway,auth-service,wallet-service,payment-service,notification-service,reward-service --parallel=2 -- --runInBand

      - name: Backend lint
        run: pnpm exec nx run-many -t lint -p api-gateway,auth-service,wallet-service,payment-service,notification-service,reward-service --parallel=3

      - name: Web TypeScript check
        run: pnpm exec tsc -p apps/web/tsconfig.json --noEmit

      - name: Admin TypeScript check
        run: pnpm exec tsc -p apps/admin-web/tsconfig.json --noEmit

      - name: CI boundary
        run: echo "Validation complete - production deployment is intentionally not part of CI."
